<svg viewBox="0 0 480 90" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sandaru Dulneth" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="typeClip">
      <rect x="0" y="0" width="0" height="90">
        <animate attributeName="width" from="0" to="448" dur="1.6s" fill="freeze" calcMode="linear" begin="0s" />
      </rect>
    </clipPath>
  </defs>

  <style>
    text {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif;
      font-weight: 800;
      font-size: 48px;
      letter-spacing: -1px;
      fill: #e6edf3;
    }
    .cursor {
      fill: #2ea44f;
      opacity: 0;
      animation: blink 0.9s step-end infinite;
      animation-delay: 1.6s;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>

  <text x="16" y="58" clip-path="url(#typeClip)">Sandaru Dulneth</text>
  <rect class="cursor" x="16" y="20" width="4" height="46">
    <animate attributeName="x" from="16" to="450" dur="1.6s" fill="freeze" calcMode="linear" begin="0s" />
  </rect>
</svg>
